<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">What sets and changes the status of a word</title>
<desc id="d">The six word statuses. A digital text layer gives native. The guard gives ok, doubtful or unscored to OCR words. Applying a fix turns a doubtful word into fixed and the other words of a join into absorbed; undo goes back. Your decisions set review and leave the status alone.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a869a"/></marker></defs>
<rect x="20" y="20" width="260" height="52" rx="8" fill="#dbe8fb" stroke="#5b8bd6" stroke-width="1.6"/>
<text x="150.0" y="50.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Digital page, legible text layer</text>
<rect x="320" y="20" width="300" height="52" rx="8" fill="#fdefc7" stroke="#c98f12" stroke-width="1.6"/>
<text x="470.0" y="50.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">OCR word, judged by the guard</text>
<line x1="150" y1="72" x2="150" y2="120" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<rect x="60" y="120" width="180" height="56" rx="8" fill="#dbe8fb" stroke="#5b8bd6" stroke-width="1.6"/>
<text x="150.0" y="143.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">native</text>
<text x="150.0" y="161.0" text-anchor="middle" font-size="13" fill="#1b2430">not judged, no p_wrong</text>
<line x1="470" y1="72" x2="365" y2="120" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<line x1="470" y1="72" x2="480" y2="120" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<line x1="470" y1="72" x2="590" y2="120" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<rect x="320" y="120" width="90" height="56" rx="8" fill="#dcf1e0" stroke="#4a9d5b" stroke-width="1.6"/>
<text x="365.0" y="143.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">ok</text>
<text x="365.0" y="160.0" text-anchor="middle" font-size="12" fill="#1b2430">not flagged</text>
<rect x="430" y="120" width="100" height="56" rx="8" fill="#fdefc7" stroke="#c98f12" stroke-width="1.6"/>
<text x="480.0" y="143.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">doubtful</text>
<text x="480.0" y="160.0" text-anchor="middle" font-size="12" fill="#1b2430">flagged</text>
<rect x="550" y="120" width="80" height="56" rx="8" fill="#e6e8ec" stroke="#8a94a6" stroke-width="1.6"/>
<text x="590.0" y="143.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2430">unscored</text>
<text x="590.0" y="159.0" text-anchor="middle" font-size="11" fill="#1b2430">no verdict</text>
<line x1="440" y1="176" x2="440" y2="250" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<line x1="500" y1="250" x2="500" y2="176" stroke="#7a869a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="383.0" y="189" width="84.0" height="22" rx="11" fill="#eadcf8" stroke="#8e5cc2" stroke-width="1.2"/>
<text x="425" y="204.5" text-anchor="middle" font-size="12" fill="#1b2430">apply a fix</text>
<rect x="495.0" y="215" width="50.0" height="22" rx="11" fill="#e8edf3" stroke="#8a94a6" stroke-width="1.2"/>
<text x="520" y="230.5" text-anchor="middle" font-size="12" fill="#1b2430">undo</text>
<rect x="390" y="250" width="120" height="58" rx="8" fill="#eadcf8" stroke="#8e5cc2" stroke-width="1.6"/>
<text x="450.0" y="265.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">fixed</text>
<text x="450.0" y="282.5" text-anchor="middle" font-size="12" fill="#1b2430">the word the</text>
<text x="450.0" y="299.5" text-anchor="middle" font-size="12" fill="#1b2430">fix changed</text>
<line x1="525" y1="176" x2="580" y2="250" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<line x1="375" y1="176" x2="405" y2="250" stroke="#7a869a" stroke-width="2" marker-end="url(#head)"/>
<rect x="530" y="250" width="100" height="58" rx="8" fill="#eadcf8" stroke="#8e5cc2" stroke-width="1.6"/>
<text x="580.0" y="265.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">absorbed</text>
<text x="580.0" y="282.5" text-anchor="middle" font-size="12" fill="#1b2430">joined or</text>
<text x="580.0" y="299.5" text-anchor="middle" font-size="12" fill="#1b2430">dropped</text>
<rect x="20" y="340" width="600" height="160" rx="10" fill="none" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="2 5"/>
<rect x="85.0" y="351" width="470.0" height="22" rx="11" fill="#e8edf3" stroke="#8a94a6" stroke-width="1.2"/>
<text x="320" y="366.5" text-anchor="middle" font-size="12" fill="#1b2430">Your decision is a separate field, review; the status does not change</text>
<rect x="40" y="390" width="170" height="90" rx="8" fill="#dcf1e0" stroke="#4a9d5b" stroke-width="1.6"/>
<text x="125.0" y="430.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">accept</text>
<text x="125.0" y="447.0" text-anchor="middle" font-size="12" fill="#1b2430">review = accepted</text>
<rect x="235" y="390" width="170" height="90" rx="8" fill="#eadcf8" stroke="#8e5cc2" stroke-width="1.6"/>
<text x="320.0" y="421.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">correct</text>
<text x="320.0" y="438.5" text-anchor="middle" font-size="12" fill="#1b2430">review = corrected,</text>
<text x="320.0" y="455.5" text-anchor="middle" font-size="12" fill="#1b2430">text replaced</text>
<rect x="430" y="390" width="170" height="90" rx="8" fill="#e6e8ec" stroke="#8a94a6" stroke-width="1.6"/>
<text x="515.0" y="430.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">reopen</text>
<text x="515.0" y="447.0" text-anchor="middle" font-size="12" fill="#1b2430">review = none again</text>
</svg>
